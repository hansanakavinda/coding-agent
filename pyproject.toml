[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "free-coding-agent"
version = "0.1.0"
description = "Autonomous CLI coding agent powered by OpenRouter free-tier models."
authors = [{ name = "Free Coding Agent Team" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12.0",
    "rich>=13.0.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "tiktoken>=0.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
free-agent = "cli:app"
free-coding-agent = "cli:app"
agent = "cli:app"

[tool.setuptools.packages.find]
include = ["core*", "tools*", "providers*", "memory*"]
exclude = ["legacy*", "generated*", "tests*"]

[tool.setuptools]
py-modules = ["cli", "agent"]
