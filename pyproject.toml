[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "free-coding-agent"
version = "0.1.0"
description = "Autonomous CLI coding agent powered by OpenRouter free-tier models."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Hansana Kavinda", email = "hansanakavinda7@gmail.com" }]
requires-python = ">=3.11"

dependencies = [
    "typer>=0.12.0",
    "rich>=13.0.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "tiktoken>=0.7.0",
    "prompt_toolkit>=3.0.38",
]

[project.urls]
Homepage = "https://github.com/hansanakavinda/coding-agent"
Repository = "https://github.com/hansanakavinda/coding-agent"
Issues = "https://github.com/hansanakavinda/coding-agent/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
free-agent = "cli:app"
free-coding-agent = "cli:app"
agent = "cli:app"

[tool.setuptools.packages.find]
include = ["core*", "tools*", "providers*", "memory*"]
exclude = ["legacy*", "generated*", "tests*"]

[tool.setuptools]
py-modules = ["cli", "agent"]
